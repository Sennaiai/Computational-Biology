name: CAR-T dynamics validation

on:
  pull_request:
    paths:
      - 'projects/modeling/cart_cell/**'
      - 'tests/modeling/cart_cell/**'
      - '.github/workflows/cart-dynamics.yml'
  push:
    branches: [main]
    paths:
      - 'projects/modeling/cart_cell/**'
      - 'tests/modeling/cart_cell/**'
      - '.github/workflows/cart-dynamics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/cart-matplotlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install the study and notebook dependencies
        run: python -m pip install -e 'projects/modeling/cart_cell[notebook]' ruff==0.14.6
      - name: Verify model components and workflow isolation
        run: |
          python -m ruff check projects/modeling/cart_cell/src projects/modeling/cart_cell/scripts tests/modeling/cart_cell
          python -m ruff format --check projects/modeling/cart_cell/src projects/modeling/cart_cell/scripts tests/modeling/cart_cell
          python -m unittest discover -s tests/modeling/cart_cell -v
      - name: Execute the comparative study
        run: python projects/modeling/cart_cell/scripts/execute_notebook.py --output-dir artifacts/cart_cell
      - name: Save numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: cart-dynamics-validation
          if-no-files-found: error
          path: |
            artifacts/cart_cell/CAR_T_Tradeoffs.ipynb
            artifacts/cart_cell/cart_results.json
            artifacts/cart_cell/pkpd_results.json
            artifacts/cart_cell/cart_population.svg
            artifacts/cart_cell/cart_components.svg
            artifacts/cart_cell/pkpd_trajectories.svg
            artifacts/cart_cell/pkpd_tradeoffs.svg
