name: Bioinformatics quality checks

on:
  pull_request:
    paths:
      - 'projects/Genomic_Ancestry/**'
      - 'tests/test_assign_population.py'
      - 'tests/test_extract_pcs.py'
      - 'requirements-ci.txt'
  push:
    branches: [main]
    paths:
      - 'projects/Genomic_Ancestry/**'
      - 'tests/test_assign_population.py'
      - 'tests/test_extract_pcs.py'
      - 'requirements-ci.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m ruff check projects/Genomic_Ancestry/scripts tests/test_assign_population.py tests/test_extract_pcs.py
      - run: python -m pytest tests/test_assign_population.py tests/test_extract_pcs.py
