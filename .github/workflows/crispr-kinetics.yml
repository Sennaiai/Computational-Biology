name: CRISPR kinetic validation

on:
  pull_request:
    paths:
      - 'projects/modeling/crispr_cas9/**'
      - 'tests/modeling/crispr_cas9/**'
      - '.github/workflows/crispr-kinetics.yml'
  push:
    branches: [main]
    paths:
      - 'projects/modeling/crispr_cas9/**'
      - 'tests/modeling/crispr_cas9/**'
      - '.github/workflows/crispr-kinetics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/crispr-matplotlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install the study and notebook dependencies
        run: python -m pip install -e 'projects/modeling/crispr_cas9[notebook]' ruff==0.14.6
      - name: Check study source and its tests
        run: |
          python -m ruff check projects/modeling/crispr_cas9/src projects/modeling/crispr_cas9/scripts tests/modeling/crispr_cas9
          python -m ruff format --check projects/modeling/crispr_cas9/src projects/modeling/crispr_cas9/scripts tests/modeling/crispr_cas9
          python -m unittest discover -s tests/modeling/crispr_cas9 -v
      - name: Execute the notebook and numerical experiment
        run: python projects/modeling/crispr_cas9/scripts/execute_notebook.py --output-dir artifacts/crispr_cas9
      - name: Execute the intracellular and lineage prototype
        run: python projects/modeling/crispr_cas9/scripts/execute_notebook.py --notebook Cellular_Editing_Simulation.ipynb --output-dir artifacts/cellular
      - name: Save numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: crispr-kinetic-validation
          if-no-files-found: error
          path: |
            artifacts/crispr_cas9/CRISPR_Cas9_Kinetics.ipynb
            artifacts/crispr_cas9/kinetics.json
            artifacts/crispr_cas9/kinetics.svg
            artifacts/cellular/Cellular_Editing_Simulation.ipynb
            artifacts/cellular/cellular_results.json
            artifacts/cellular/cellular_simulation.svg
